name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Unit tests
        run: pnpm test

      - name: Validate tasksets
        run: |
          set +e
          # 用目录而不是 domain@version：任务集版本会往前滚，写死 ref 的 CI 迟早红
          node dist/cli.js taskset validate tasksets/web-guidance; a=$?
          node dist/cli.js taskset validate tasksets/general-20; b=$?
          # 退出码 3 = 有检查项需要真跑模型，CI 允许；1 = 硬失败
          if [ $a -eq 1 ] || [ $b -eq 1 ]; then exit 1; fi

      - name: Validate published cards
        run: |
          node -e '
            const fs = require("fs");
            const Ajv2020 = require("ajv/dist/2020.js");
            const ajv = new Ajv2020({ strict: false, logger: false });
            const validate = ajv.compile(JSON.parse(fs.readFileSync("schema/skillcard.schema.json", "utf8")));
            let bad = 0;
            for (const f of fs.readdirSync("results").filter((x) => x.endsWith(".json"))) {
              const ok = validate(JSON.parse(fs.readFileSync("results/" + f, "utf8")));
              console.log((ok ? "✓ " : "✗ ") + f);
              if (!ok) { bad++; console.error(JSON.stringify(validate.errors)); }
            }
            process.exit(bad ? 1 : 0);
          '

      - name: Tier 0 smoke (no model)
        run: |
          node dist/cli.js probe ./examples/demo-skill --only static-cost,uninstall-clean --format json > /tmp/card.json
          node -e "const c=require('/tmp/card.json'); if(!c.tier0.static_cost.supported) process.exit(1); console.log('tokens', c.tier0.static_cost.total_tokens)"
